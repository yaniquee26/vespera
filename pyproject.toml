[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[project]
name = "vespera"
version = "0.1.0"
description = "Evidence-based reliability testing for LLMs in Russian, Romanian and English"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
]
 
[project.scripts]
vespera = "vespera.cli:app"
 
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
 
[tool.setuptools.packages.find]
where = ["src"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=vespera --cov-report=term-missing"
 
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
 
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true