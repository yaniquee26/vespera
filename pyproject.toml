[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vespera"
version = "1.0.0"
description = "Local test bench for LLM chatbots and tool-using agents in English, Russian and Romanian: rule-based checks, Wilson intervals, CI gate"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ian Barda" }]
requires-python = ">=3.12"
keywords = ["llm", "ai-safety", "red-teaming", "prompt-injection", "llm-evaluation", "qa", "agents", "owasp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.18",  # older Typer breaks with Click 8.2+: crashes, or required arguments go unchecked
    "httpx>=0.27",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/yaniquee26/vespera"
Reports = "https://yaniquee26.github.io/vespera/"
Changelog = "https://github.com/yaniquee26/vespera/blob/main/CHANGELOG.md"

[project.scripts]
vespera = "vespera.cli:app"

[project.optional-dependencies]
# Vespera Studio, the local web app (`vespera ui`)
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vespera = ["data/*", "ui/templates/*.html", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=vespera --cov-report=term-missing"
filterwarnings = [
    # Starlette 1.x prefers httpx2 for its test client; httpx still works and is what we ship
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/vespera/report_template.py" = ["E501"]
"src/vespera/compare_template.py" = ["E501"]  # an HTML template, not code

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
